name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/FirewallTutor.Web -c Release -o release

      - name: Rewrite base href for the /titrate-firewall-tutor/ project-page subpath
        run: sed -i 's|<base href="/" />|<base href="/titrate-firewall-tutor/" />|' release/wwwroot/index.html

      - name: Add SPA fallback for client-side routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Disable Jekyll processing (needed for the _framework/ folder)
        run: touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
